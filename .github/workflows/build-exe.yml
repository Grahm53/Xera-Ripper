name: Windows exe

# Builds xera-ripper.exe on a real Windows runner and SMOKE-TESTS the resulting executable (it starts the web UI, serves the
# embedded files, exports a Unity project and loads a dropped folder). Run it from the Actions tab ("Run workflow"), or push a
# tag like v0.1.0 to also publish the exe on that tag's Release page.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the exe to a Release when a tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Build xera-ripper.exe
        run: node tools/build-exe.mjs
      - name: Smoke-test the real executable
        run: node tools/smoke-exe.mjs dist/xera-ripper.exe
      - uses: actions/upload-artifact@v4
        with:
          name: xera-ripper-windows-x64
          path: |
            dist/xera-ripper.exe
            dist/xera-ripper.exe.sha256
          if-no-files-found: error
      - name: Publish on the Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/xera-ripper.exe dist/xera-ripper.exe.sha256 --title "Xera Ripper $GITHUB_REF_NAME" --generate-notes --verify-tag
