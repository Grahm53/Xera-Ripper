name: Windows exe

# Builds xera-ripper.exe on a real Windows runner and SMOKE-TESTS the resulting executable (it starts the web UI, serves the
# embedded files, exports a Unity project and loads a dropped folder). Run it from the Actions tab ("Run workflow"); type a tag such
# as v0.1.0 into the box to also publish the exe on that tag's Release page (pushing a v* tag does the same).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v0.1.0). Leave empty to only build and test.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write   # only used to attach the exe to a Release when a tag is pushed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Build xera-ripper.exe
        run: node tools/build-exe.mjs
      - name: Smoke-test the real executable
        run: node tools/smoke-exe.mjs dist/xera-ripper.exe
      - uses: actions/upload-artifact@v4
        with:
          name: xera-ripper-windows-x64
          path: |
            dist/xera-ripper.exe
            dist/xera-ripper.exe.sha256
          if-no-files-found: error
      - name: Publish on the Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "release tag must look like v1.2.3, got: $TAG"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/xera-ripper.exe dist/xera-ripper.exe.sha256 --clobber
          else
            gh release create "$TAG" dist/xera-ripper.exe dist/xera-ripper.exe.sha256 --target "$GITHUB_SHA" --title "Xera Ripper $TAG" --generate-notes
          fi
